# ---- Who / where / when -------------------------------------------------
origin_airports: [MAD]            # where you fly out of
search_window:
  start: "2026-09-12"
  end:   "2026-12-20"
# Exact trip dates instead of the window (leave empty to use the window above).
# Only flights that leave AND return on these exact days are priced, one row per range.
# Formats: "Oct 3-10", "October 3 - 10", "2026-10-03:2026-10-10", "Dec 28 - Jan 3".
fixed_dates: []                   # e.g. ["Oct 3-10", "Nov 5-9"]
# ---- What to track right now ---------------------------------------------
# Leave a list empty to mean "all". Country names must match destinations.yaml.
countries: []                     # e.g. [Bulgaria, Switzerland, Austria, France, Italy]
skip_countries: []                # e.g. [Morocco, Portugal]   (applied after `countries`)
only_destinations: []             # e.g. [rila_seven_lakes, lauterbrunnen]
skip_destinations: []             # e.g. [vitosha]

trip_nights:                      # only consider round trips this long
  min: 2
  max: 5
currency: EUR

# ---- Cost assumptions (edit freely) --------------------------------------
cabin_bag_estimate: 25            # EUR added to every flight (Ryanair 10kg bag both ways)
default_hostel_per_night: 30      # used if a destination has no hostel baseline
free_stay:                        # destination ids where you sleep at a friend's (hostel cost -> 0)
  - lauterbrunnen
  - zermatt
  - oeschinensee
  - appenzell

# ---- Alerting -------------------------------------------------------------
alert:
  total_below: 180                # flag any trip whose all-in cost is under this
  # "Decently cheaper than the norm": BOTH conditions must hold
  drop_pct: 15                    #   flight is >= this % below its norm ...
  drop_min_eur: 20                #   ... AND at least this many euros below it (€20→€30 swings are ignored)
  norm_days: 30                   #   norm = median of that destination-month's prices over this many days
  new_low: true                   # also flag a new all-time low, if it beats the old low by >= drop_min_eur
  digest_always: true             # send the ranked digest every run even with no deals
  max_google_verifications: 8     # per run, spread across your SerpApi keys
  google_fill_fixed_dates: 15     # fixed-dates mode only: Google lookups per run for destinations
                                  # Ryanair/Travelpayouts have no price for on those exact days
  min_serpapi_searches_left: 20   # keep this much quota in reserve per key

# ---- Multi-city chains (one-way fares) -------------------------------------
# Itineraries like MAD → Tangier → Marrakech → MAD built from one-way fares, so one trip covers
# several places. Every airport is scanned for every day of the window, so this only runs on short
# windows (max_window_days) – set them with --from/--to, --dates, or the run form. Enable per run
# with --chain / the "chain" box, or permanently here.
chain:
  enabled: false
  min_stops: 2                    # places visited per itinerary (1 = a round trip built from one-ways)
  max_stops: 3
  nights_per_stop: {min: 2, max: 5}
  max_window_days: 21             # refuse (and skip) longer windows – the scan is airports × days calls
  max_leg_price: 250              # ignore one-way legs above this (EUR)
  top: 10                         # unique routes to report
  threads: 4                      # parallel Ryanair fare-finder calls

# ---- Data sources ---------------------------------------------------------
sources:
  ryanair: true                   # free, unofficial, exact base fares
  travelpayouts: true             # free, cached all-airline prices (token in env)
  serpapi: true                   # Google Flights verification (keys in env, rotated)
  fast_flights_fallback: true     # free Google scraper, used only when SerpApi quota is out
