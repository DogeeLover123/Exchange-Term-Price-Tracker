# Each destination = one "trip idea". The tracker searches flights to every airport
# listed, adds the transit recipe + hostel baseline, and checks the season window.
#
# Fields:
#   id            unique slug
#   name          what shows in the email
#   country
#   airports      IATA codes to search (first = preferred)
#   open_months   months the trip is sensible (1-12). Outside -> excluded from alerts.
#   closure_note  human note about huts/lifts/roads (shown in email)
#   hostel        city + per_night baseline (EUR, dorm bed) + optional search hint
#   transit       list of ground legs. cost = ROUND TRIP total in EUR.
#   extras        optional fixed costs (lifts, park fees) round-trip
#   alert_below   optional per-destination override of alert.total_below
#   notes         free text

# =============================== PORTUGAL ===============================
